name: Agentic ML Workflow Scheduler (LangGraph)

on:
  schedule:
    - cron: '0 5 * * *' # Runs at 05:00 UTC every day
  workflow_dispatch: 

jobs:
  run_ml_agent:
    runs-on: ubuntu-latest
    
    env:
      # Define the Gemini model to be used by the Python script
      # Using gemini-1.5-flash for speed and efficiency in agentic loops
      GEMINI_MODEL_NAME: "gemini-1.5-flash"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangGraph Multi-Agent Automation
        run: python main_langgraph.py
        env:
          # Google Gemini API Key from GitHub Secrets
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          
          # Agent credentials
          AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          
          # Model name passed to the script
          LLM_MODEL_NAME: ${{ env.GEMINI_MODEL_NAME }}
